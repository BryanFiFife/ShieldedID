[package]
name = "shielded-age-zk"
version = "1.5.0"
edition = "2021"
description = "Zero-knowledge bound proofs for Shielded ID"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
bulletproofs = "3.0.1"
clear_on_drop = { version = "0.2", features = ["no_cc"] }
curve25519-dalek-ng = "3.0"
merlin = "2.0"
rand = "0.7"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
base64 = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[package]
name = "shielded-age-zk"
version = "0.1.0"
edition = "2021"
description = "Zero-knowledge age proof WASM module"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
bulletproofs = "3.0.1"
curve25519-dalek-ng = "3.0"
merlin = "2.0"
rand = "0.7"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
base64 = "0.21"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]
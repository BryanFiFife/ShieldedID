[package]
name = "zk-agent"
version = "1.6.1"
edition = "2021"
description = "Local ZK proof agent using Bulletproofs"

[dependencies]
bulletproofs = "5.0.0"
curve25519-dalek = "=4.1.3"
merlin = "3.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
warp = { version = "0.4", features = ["server"] }
base64 = "0.21"
chrono = "0.4"

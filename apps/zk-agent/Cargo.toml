[package]
name = "zk-agent"
version = "1.5.0"
edition = "2021"
description = "Local ZK proof agent using Bulletproofs"

[dependencies]
bulletproofs = "4.0"
curve25519-dalek = "4.0"
curve25519-dalek-ng = "4.0"
merlin = "3.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
warp = "0.3"
base64 = "0.21"
chrono = "0.4"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
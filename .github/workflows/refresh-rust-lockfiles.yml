name: Refresh Rust lockfiles

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  refresh-rust-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and validate Rust proof crates
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/age-zk && cargo update && cargo check)
          (cd apps/zk-agent && cargo update && cargo test)
      - name: Commit generated Rust lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/age-zk/Cargo.lock apps/zk-agent/Cargo.lock; then
            echo "Rust lockfiles are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/age-zk/Cargo.lock apps/zk-agent/Cargo.lock
          git commit -m "chore(deps): refresh patched Rust lockfiles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
